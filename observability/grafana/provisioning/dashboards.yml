apiVersion: 1
providers:
  - name: RoundTrip
    orgId: 1
    folder: RoundTrip
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      # Grafana가 JSON을 읽는 경로 예시다.
      # 저장소의 observability/grafana/dashboards 디렉터리를 이 경로에 복사하거나 연결한다.
      path: /var/lib/grafana/dashboards/roundtrip
